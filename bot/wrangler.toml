name = "gprop-visitor-bot"
main = "src/index.js"
compatibility_date = "2024-11-01"
# Workers free plan is enough for family use (100k requests/day, 1k KV writes/day).

# --- Routing -------------------------------------------------------------
# The bot is served on your potatoportal.dev zone. Telegram calls the webhook
# over HTTPS at:  https://gprop-bot.potatoportal.dev/tg/<TELEGRAM_WEBHOOK_SECRET>
# Requires potatoportal.dev to be an active zone on this Cloudflare account.
routes = [
  { pattern = "gprop-bot.potatoportal.dev", custom_domain = true }
]

# --- Cron: check GProp announcements every 30 min, post new ones to the topic
[triggers]
crons = ["*/30 * * * *"]

# --- State store (KV) ----------------------------------------------------
# Holds: cached GProp auth token, and per-user conversation state.
# Create it once with:  wrangler kv namespace create STATE
# then paste the returned id below.
[[kv_namespaces]]
binding = "STATE"
id = "e9a39ff140e94971a422a8cf5fe93b47"

# --- Non-secret config ---------------------------------------------------
[vars]
# Which GProp login field to send: "email" or "contact" (phone).
GPROP_LOGIN_FIELD = "email"

# --- Secrets (set via `wrangler secret put <NAME>`, never commit) ---------
#   TELEGRAM_BOT_TOKEN        from @BotFather
#   TELEGRAM_WEBHOOK_SECRET   random string you choose (used in the webhook path)
#   GPROP_LOGIN_ID            your GProp email or phone
#   GPROP_PASSWORD            your GProp password
#   ALLOWED_CHAT_ID           the family group chat id (negative number)
#   ANNOUNCE_CHAT_ID          group (with Topics) that receives GProp announcements
#   ANNOUNCE_THREAD_ID        topic id inside that group (from /chatid in the topic)
#   ALLOWED_USER_IDS          optional, comma-separated user ids to further restrict
